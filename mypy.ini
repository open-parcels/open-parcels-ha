# mypy settings; run `mypy custom_components/open_parcels` (pre-commit does).
# Strict. Server payloads are still `dict[str, Any]`; TypedDicts are the next step (HA-026).
[mypy]
python_version = 3.13
strict = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true

# Only on Home Assistant releases that ship it; voluptuous stands in before that.
[mypy-probatio.*]
ignore_missing_imports = true
