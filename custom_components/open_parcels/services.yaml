track_parcel:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: open_parcels
    tracking_number:
      required: true
      example: "EXAMPLE0000000001"
      selector:
        text:
    carrier:
      example: dhl
      selector:
        text:
    label:
      selector:
        text:
    direction:
      default: receiving
      selector:
        select:
          translation_key: direction
          options:
            - receiving
            - sending

archive_parcel:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: open_parcels
    tracking_number:
      selector:
        text:
    parcel_id:
      selector:
        text:

refresh:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: open_parcels
    tracking_number:
      selector:
        text:
    parcel_id:
      selector:
        text:

run_action:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: open_parcels
    action:
      required: true
      example: import_history
      selector:
        text:
    input:
      selector:
        object:
    confirm:
      default: false
      selector:
        boolean:

cancel_job:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: open_parcels
